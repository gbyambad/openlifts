name: openlifts
description: "OpenLifts — a local-first StrongLifts 5x5 barbell strength tracker."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # State management (house pattern: Riverpod + codegen)
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0

  # Navigation
  go_router: ^17.3.0

  # Immutable models (codegen)
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  drift: ^2.34.2
  drift_flutter: ^0.3.1
  fl_chart: ^1.2.0
  flutter_svg: ^2.3.0

  # Backup / restore: OS-native share, file picking, and local file paths
  share_plus: ^12.0.0
  file_picker: ^10.3.4
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Codegen
  build_runner: ^2.4.13
  riverpod_generator: ^4.0.0+1
  freezed: ^3.2.3
  json_serializable: ^6.8.0

  # Lint
  very_good_analysis: ^10.3.0
  # Codegen
  drift_dev: ^2.34.0
  # Launcher icons
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/brand/icon.png"
  adaptive_icon_background: "#1A1712"
  adaptive_icon_foreground: "assets/brand/icon-foreground.png"
  remove_alpha_ios: true
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/seed/
  fonts:
    - family: Barlow
      fonts:
        - asset: assets/fonts/Barlow-Regular.ttf
        - asset: assets/fonts/Barlow-Medium.ttf
          weight: 500
        - asset: assets/fonts/Barlow-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Barlow-Bold.ttf
          weight: 700
